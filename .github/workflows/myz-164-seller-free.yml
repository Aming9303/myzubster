name: MYZ-164 Seller Free policy

on:
  push:
    branches: [main]
    paths:
      - 'src/routes/sellerRoutes.js'
      - 'src/routes/listingRoutes.js'
      - 'src/services/freeSellerPolicy.js'
      - 'src/models/SellerMembership.js'
      - 'tests/sellerMembership.test.js'
      - 'test/sellerMonetizationGuard.test.js'
      - '.github/workflows/myz-164-seller-free.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/routes/sellerRoutes.js'
      - 'src/routes/listingRoutes.js'
      - 'src/services/freeSellerPolicy.js'
      - 'src/models/SellerMembership.js'
      - 'tests/sellerMembership.test.js'
      - 'test/sellerMonetizationGuard.test.js'
      - '.github/workflows/myz-164-seller-free.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seller-free-policy:
    name: Seller Free policy regression
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run MYZ-164 regression tests
        run: npx jest tests/sellerMembership.test.js test/sellerMonetizationGuard.test.js --runInBand
